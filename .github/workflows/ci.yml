name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install grammars
        run: >-
          cargo run -- lang add html markdown rust typescript python go c objc cpp
          java ruby lua zig bash solidity elixir swift dart
        env:
          CX_CACHE_DIR: ${{ runner.temp }}/cx-cache
      - name: Prepare explicit grammar loader directory
        run: node scripts/prepare-ci-grammars.mjs "${{ runner.temp }}/cx-cache/grammars" "${{ runner.temp }}/cx-test-grammars"
      - run: cargo test --locked
        env:
          CX_CACHE_DIR: ${{ runner.temp }}/cx-cache
          TREE_SITTER_LANGUAGE_PACK_LIBS_DIR: ${{ runner.temp }}/cx-test-grammars

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features -- -D warnings

  pi-extension:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: cargo build --locked
      - name: Build and install native Pi test asset
        shell: bash
        run: |
          target="$(rustc -vV | awk '/^host:/ {print $2}')"
          node scripts/build-pi-cx-asset.mjs "$target" "$PWD/target/debug/cx" "$RUNNER_TEMP/pi-assets"
          mkdir -p "$RUNNER_TEMP/pi-native"
          tar xzf "$RUNNER_TEMP/pi-assets/pi-cx-$target.tar.gz" -C "$RUNNER_TEMP/pi-native"
          PI_CX_ASSET_DIR="$RUNNER_TEMP/pi-native" node scripts/install-pi-cx.mjs
          echo "PI_CX_TEST_BINARY=$RUNNER_TEMP/pi-native/bin/cx" >> "$GITHUB_ENV"
          echo "PI_CX_TEST_GRAMMARS=$RUNNER_TEMP/pi-native/grammars" >> "$GITHUB_ENV"
      - run: npm run typecheck:pi
      - run: npm run test:pi

  auto-tag:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [fmt, test, clippy, pi-extension]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag if version bumped
        id: tag
        run: |
          RAW="$(grep '^version' Cargo.toml | head -1)"
          VERSION="v$(printf '%s' "$RAW" | sed 's/.*"\(.*\)"/\1/')"
          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "Tag $VERSION already exists, skipping"
          else
            echo "Creating tag $VERSION"
            git tag "$VERSION"
            git push origin "$VERSION"
            echo "tag=$VERSION" >> "$GITHUB_OUTPUT"
          fi

  publish:
    if: needs.auto-tag.outputs.tag != ''
    needs: auto-tag
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.auto-tag.outputs.tag }}
