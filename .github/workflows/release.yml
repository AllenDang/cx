name: Release

on:
  push:
    tags:
      - "v*"
  workflow_call:
    inputs:
      tag:
        description: Existing version tag to publish
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish or retry
        required: true
        type: string

permissions:
  contents: write
  id-token: write

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check release tag matches package version
        run: node -e "const p=require('./package.json'); if (process.env.RELEASE_TAG !== 'v'+p.version) throw new Error('tag/package version mismatch');"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../cx-${{ matrix.target }}.tar.gz cx
          cd ../../..
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "target/${{ matrix.target }}/release/cx.exe" -DestinationPath "cx-${{ matrix.target }}.zip"
      - name: Build Pi package asset
        shell: bash
        run: |
          binary="target/${{ matrix.target }}/release/cx"
          if [[ "${{ runner.os }}" == "Windows" ]]; then binary="${binary}.exe"; fi
          node scripts/build-pi-cx-asset.mjs "${{ matrix.target }}" "$binary" "$PWD"
      - uses: actions/upload-artifact@v4
        with:
          name: cx-${{ matrix.target }}
          path: |
            cx-${{ matrix.target }}.*
            pi-cx-${{ matrix.target }}.tar.gz
            pi-cx-${{ matrix.target }}.tar.gz.sha256

  pi-extension-unit:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
      - uses: actions/download-artifact@v4
        with:
          name: cx-x86_64-unknown-linux-gnu
          path: ci-asset
      - name: Prepare native Pi test asset
        shell: bash
        run: |
          mkdir -p ci-native
          tar xzf ci-asset/pi-cx-x86_64-unknown-linux-gnu.tar.gz -C ci-native
          chmod +x ci-native/bin/cx
          echo "PI_CX_TEST_BINARY=$PWD/ci-native/bin/cx" >> "$GITHUB_ENV"
          echo "PI_CX_TEST_GRAMMARS=$PWD/ci-native/grammars" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install native test asset
        run: node scripts/install-pi-cx.mjs
        env:
          PI_CX_ASSET_DIR: ${{ github.workspace }}/ci-native
      - run: npm run typecheck:pi
      - run: npm run test:pi

  release:
    needs: [build, pi-extension-unit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            cx-*.tar.gz
            cx-*.zip
            pi-cx-*.tar.gz
            pi-cx-*.tar.gz.sha256
